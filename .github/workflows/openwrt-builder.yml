name: Build OpenWrt

permissions:
  contents: write

on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - main

env:
  REPO_BRANCH: openwrt-23.05
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential flex bison cmake g++ libncurses-dev git libssl-dev gettext unzip wget curl time python3 python3-pip
          sudo -E pip3 install pyyaml
          df -h

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 --branch ${{ env.REPO_BRANCH }} https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout ${{ env.REPO_BRANCH }}

      - name: Load custom feeds
        run: |
          cd openwrt
          [ -e ${{ github.workspace }}/${{ env.DIY_P1_SH }} ] && bash ${{ github.workspace }}/${{ env.DIY_P1_SH }}
          ./scripts/feeds update -a

      - name: Load custom configuration
        run: |
          cd openwrt
          [ -e ${{ github.workspace }}/${{ env.DIY_P2_SH }} ] && bash ${{ github.workspace }}/${{ env.DIY_P2_SH }}
          ./scripts/feeds install -a
          make defconfig

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload firmware to artifact
        uses: actions/upload-artifact@main
        if: env.UPLOAD_FIRMWARE == 'true'
        with:
          name: OpenWrt_firmware
          path: openwrt/bin/targets/*/*/*.bin
